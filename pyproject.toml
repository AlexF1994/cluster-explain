[project]
name = "clusterxplain"
version = "0.1.0"

[tool.poetry]
name = "clusterxplain"
version = "0.1.0"
description = "Provide feature relevance scores fo clustering."
authors = ["Alexander Fottner <alexander.fottner@uni-a.de>", "Jonathan Pfahler"]
license = "MIT"
packages = [
    { include = "cxplain", from = "src" },
]
include = ["src/cxplain/res/*"]
readme = "README.md"
documentation = "https://cluster-explain.readthedocs.io/en/latest/index.html"
repository = "https://github.com/AlexF1994/cluster-explain"

[tool.poetry.urls]
"Changelog" = "https://github.com/AlexF1994/cluster-explain/blob/release/CHANGELOG.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pyhocon = "^0.3.63"
importlib-metadata = {version = "^1.0", python = "<3.8"}
matplotlib = "^3.11.1"
scikit-learn = "^1.9.0"
pandas = "^3.0.5"
numpy = ">=1.26,<2.0"
nptyping = "^2.5.0"
shap = "<0.52"
seaborn = "^0.13.2"
notebook-intelligence = "^5.3.1"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
pre-commit = "^4.6.2"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
jupyterlab = "^4.6.3"
bandit = "^1.9.4"
mypy = "^2.3.1"
isort = "^8.0.1"
ipykernel = "^7.3.0"
ruff = "^0.16.3"
pywin32 = {version = ">=311", platform = "win32"}
twine = "^7.0.0"
yellowbrick = "^1.5"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "*"
nbsphinx = "^0.9.3"
sphinxcontrib-bibtex = "^2.6.1"
sphinx-codeautolink = "^0.15.0"
furo = "*"

[tool.ruff]
line-length = 120
ignore = ["F821"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
target-version = "py39"

[tool.ruff.pycodestyle]
max-doc-length = 180

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
